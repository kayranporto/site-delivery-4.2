  <title>Área da equipe | Multi Delivery</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

<body class="team-page">
  <noscript>Este site precisa de JavaScript habilitado para funcionar.</noscript>
  <header class="team-topbar">
    <a class="team-brand" href="../index.html"><span class="team-brand-mark" aria-hidden="true">🍔</span><span>Multi Delivery</span></a>
    <div class="team-topbar-actions"><span class="role-badge" id="colaboradorPapel">Carregando...</span><button class="team-button secondary" id="colaboradorLogout" type="button">Sair</button></div>
  </header>
  <main class="team-shell" id="conteudoPrincipal">
    <section class="team-hero"><div><span class="team-eyebrow">Área da equipe</span><h1 id="colaboradorEmpresa">Carregando restaurante...</h1><p id="colaboradorResumo">Seu acesso é limitado ao papel definido pelo proprietário.</p></div></section>
    <div class="team-status" id="colaboradorStatus" role="status" aria-live="polite" hidden></div>
    <section class="team-card">
      <div class="operator-toolbar"><div><span class="team-eyebrow" id="colaboradorAreaRotulo">Operação</span><h2 id="colaboradorAreaTitulo">Carregando área...</h2></div><button class="team-button secondary" id="colaboradorAtualizar" type="button">↻ Atualizar</button></div>
      <p class="privacy-note" id="colaboradorPrivacidade"></p>
      <div class="order-list" id="colaboradorConteudo"><div class="empty-panel">Carregando dados autorizados...</div></div>
    </section>
  </main>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
  <script defer src="../js/core/app-utils.js?v=4.2.0"></script>
  <script defer src="../js/core/config.js?v=4.4.5"></script>
