<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com 'sha256-u0u1ecLVPYNekrgEx+XAUkD4bQUKUR6DUioTn79RARQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com https://va.vercel-scripts.com; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <meta name="theme-color" content="#ea1d2c"/>
  <title>Meus pedidos | Multi Delivery</title>
  <meta name="description" content="Acompanhe, filtre e repita seus pedidos."/>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="manifest" href="../manifest.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/pages/meus-pedidos.css?v=4.2.0"/>
  <link rel="stylesheet" href="../css/core/accessibility.css?v=4.2.0"/>
  <link rel="stylesheet" href="../css/core/enhancements.css?v=4.4.6"/>
  <link rel="stylesheet" href="../css/modules/client-mobile-4.5.css?v=4.6.2"/>
</head>
<body>
  <noscript>Este site precisa de JavaScript habilitado para funcionar.</noscript>
  <header class="orders-header">
    <a class="back-button" href="perfil.html" aria-label="Voltar para minha conta">←</a>
    <div>
      <small>MINHA CONTA</small>
      <h1>Meus pedidos</h1>
    </div>
    <a class="explore-link" href="../index.html">Explorar restaurantes</a>
  </header>

  <main class="orders-main">
    <section class="orders-intro" aria-labelledby="tituloHistorico">
      <div>
        <span class="eyebrow">📦 HISTÓRICO DE PEDIDOS</span>
        <h2 id="tituloHistorico">Tudo sobre seus pedidos, em um só lugar.</h2>
        <p>Acompanhe o preparo, consulte seus recibos e repita seus favoritos em poucos cliques.</p>
      </div>
      <div class="orders-total" aria-label="Quantidade de pedidos">
        <strong id="totalPedidos">—</strong>
        <span>pedidos realizados</span>
      </div>
    </section>

    <nav class="order-filters" aria-label="Filtrar pedidos">
      <button class="active" type="button" data-filtro="todos" aria-pressed="true">
        Todos <span id="contagemTodos">0</span>
      </button>
      <button type="button" data-filtro="andamento" aria-pressed="false">
        Em andamento <span id="contagemAndamento">0</span>
      </button>
      <button type="button" data-filtro="entregues" aria-pressed="false">
        Entregues <span id="contagemEntregues">0</span>
      </button>
      <button type="button" data-filtro="cancelados" aria-pressed="false">
        Cancelados <span id="contagemCancelados">0</span>
      </button>
    </nav>

    <div class="results-row">
      <p id="resumoPedidos" aria-live="polite">Carregando seus pedidos...</p>
    </div>

    <section class="orders-list" id="listaPedidos" aria-live="polite">
      <div class="orders-loading"><i></i><span>Carregando pedidos...</span></div>
    </section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
  <script defer src="../js/core/app-utils.js?v=4.4.6"></script>
  <script defer src="../js/core/supabase.js?v=4.2.0"></script>
  <script defer src="../js/modules/pos-pedido.js?v=4.5.1"></script>
  <script defer src="../js/pages/meus-pedidos.js?v=4.2.0"></script>
  <script defer src="../js/core/client-mobile-4.5.js?v=4.6.0"></script>
  <script defer src="../js/core/site-enhancements.js?v=4.4.6"></script>
</body>
</html>
