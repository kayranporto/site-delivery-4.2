name: Sincronizar versão do config

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-config-version.yml'
      - 'scripts/sync-config-cache-version.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sincronizar referências de config.js
        run: node scripts/sync-config-cache-version.js
      - name: Publicar correções se necessário
        run: |
          if git diff --quiet; then
            echo "Nenhuma correção necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html html/*.html sw.js
          git commit -m "Sincroniza cache-busting do config.js com a versão 4.4.5"
          git push
