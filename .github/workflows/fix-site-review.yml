name: Aplicar correções da revisão do site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-site-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir disponibilidade e indexação privada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home_path = Path('js/pages/home.js')
          home = home_path.read_text(encoding='utf-8')

          marker = 'function renderizarEmpresas(lista) {'
          helper = '''async function carregarDisponibilidadeEmpresas(lista) {
              const momento = new Date().toISOString();
              return Promise.all(lista.map(async (empresa) => {
                  if (empresa.status === false) return { ...empresa, abertaAgora: false };
                  try {
                      const { data, error } = await window.db.rpc("empresa_disponibilidade", {
                          p_empresa_id: String(empresa.id),
                          p_quando: momento
                      });
                      if (error) {
                          console.warn(`Disponibilidade de ${empresa.nome || empresa.id}:`, error);
                          return { ...empresa, abertaAgora: true };
                      }
                      return { ...empresa, abertaAgora: data?.aberto === true };
                  } catch (erro) {
                      console.warn(`Disponibilidade de ${empresa.nome || empresa.id}:`, erro);
                      return { ...empresa, abertaAgora: true };
                  }
              }));
          }

          '''
          if 'async function carregarDisponibilidadeEmpresas(lista)' not in home:
              if marker not in home:
                  raise SystemExit('Ponto de inserção de disponibilidade não encontrado.')
              home = home.replace(marker, helper + marker, 1)

          home = home.replace(
              'const aberta = empresa.status !== false;',
              'const aberta = empresa.abertaAgora ?? (empresa.status !== false);',
              1
          )
          home = home.replace(
              '(!filtros.abertoAgora || empresa.status !== false);',
              '(!filtros.abertoAgora || empresa.abertaAgora === true);',
              1
          )

          old_catalog = '''    empresas = (Array.isArray(data) ? data : [])
              .filter((empresa) => empresa?.id && empresa?.nome)
              .map((empresa) => ({
                  ...empresa,
                  nota_media: resumoAvaliacoes.get(String(empresa.id))?.media || 0,
                  quantidade_avaliacoes: resumoAvaliacoes.get(String(empresa.id))?.quantidade || 0
              }));
              aplicarFiltros();'''
          new_catalog = '''    const catalogo = (Array.isArray(data) ? data : [])
              .filter((empresa) => empresa?.id && empresa?.nome)
              .map((empresa) => ({
                  ...empresa,
                  nota_media: resumoAvaliacoes.get(String(empresa.id))?.media || 0,
                  quantidade_avaliacoes: resumoAvaliacoes.get(String(empresa.id))?.quantidade || 0
              }));
              empresas = await carregarDisponibilidadeEmpresas(catalogo);
              aplicarFiltros();'''
          if old_catalog not in home:
              raise SystemExit('Bloco de catálogo da Home não encontrado.')
          home = home.replace(old_catalog, new_catalog, 1)
          home_path.write_text(home, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if 'js/pages/home.js?v=4.2.1' not in index:
              raise SystemExit('Versão antiga de home.js não encontrada em index.html.')
          index_path.write_text(index.replace('js/pages/home.js?v=4.2.1', 'js/pages/home.js?v=4.4.5.1'), encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          if './js/pages/home.js?v=4.2.1' not in sw:
              raise SystemExit('Versão antiga de home.js não encontrada no service worker.')
          sw_path.write_text(sw.replace('./js/pages/home.js?v=4.2.1', './js/pages/home.js?v=4.4.5.1'), encoding='utf-8')

          Path('robots.txt').write_text('''User-agent: *
          Allow: /
          Disallow: /admin.html
          Disallow: /checkout.html
          Disallow: /dados.html
          Disallow: /entregador.html
          Disallow: /empresa-dashboard.html
          Disallow: /perfil.html
          Disallow: /html/admin.html
          Disallow: /html/checkout.html
          Disallow: /html/dados.html
          Disallow: /html/entregador.html
          Disallow: /html/empresa-dashboard.html
          Disallow: /html/empresa-colaborador.html
          Disallow: /html/empresa-equipe.html
          Disallow: /html/enderecos.html
          Disallow: /html/favoritos.html
          Disallow: /html/meus-pedidos.html
          Disallow: /html/perfil.html
          Disallow: /html/acompanhamento.html
          Disallow: /html/pedido-sucesso.html
          Disallow: /html/nova-senha.html

          Sitemap: https://kayranporto.github.io/site-delivery-4.2/sitemap.xml
          '''.replace('          ', ''), encoding='utf-8')

          Path('tests/site-review-regressions.test.js').write_text(r'''"use strict";

          const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");

          const root = path.resolve(__dirname, "..");
          const read = (file) => fs.readFileSync(path.join(root, file), "utf8");

          test("Home usa horário real no filtro Aberto agora", () => {
              const home = read("js/pages/home.js");
              assert.match(home, /rpc\("empresa_disponibilidade"/);
              assert.match(home, /abertaAgora:\s*data\?\.aberto\s*===\s*true/);
              assert.match(home, /!filtros\.abertoAgora\s*\|\|\s*empresa\.abertaAgora\s*===\s*true/);
              assert.match(read("index.html"), /js\/pages\/home\.js\?v=4\.4\.5\.1/);
              assert.match(read("sw.js"), /js\/pages\/home\.js\?v=4\.4\.5\.1/);
          });

          test("robots bloqueia as rotas privadas reais em html", () => {
              const robots = read("robots.txt");
              for (const rota of [
                  "/html/admin.html",
                  "/html/checkout.html",
                  "/html/dados.html",
                  "/html/entregador.html",
                  "/html/empresa-dashboard.html",
                  "/html/empresa-colaborador.html",
                  "/html/empresa-equipe.html",
                  "/html/enderecos.html",
                  "/html/favoritos.html",
                  "/html/meus-pedidos.html",
                  "/html/perfil.html",
                  "/html/acompanhamento.html",
                  "/html/pedido-sucesso.html",
                  "/html/nova-senha.html"
              ]) {
                  assert.match(robots, new RegExp(`^Disallow: ${rota.replaceAll(".", "\\.")}$`, "m"), `${rota} deve ficar fora de indexação`);
              }
          });
          '''.replace('          ', ''), encoding='utf-8')
          PY
      - name: Publicar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pages/home.js index.html sw.js robots.txt tests/site-review-regressions.test.js
          git commit -m "Corrige disponibilidade da Home e rotas privadas no robots"
          git push
