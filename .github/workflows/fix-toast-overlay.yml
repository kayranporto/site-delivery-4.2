name: Corrigir overlay de toasts

on:
  push:
    branches: [agent/playwright-e2e]
    paths:
      - '.github/workflows/fix-toast-overlay.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir interação e cache-busting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('css/core/enhancements.css')
          css = css_path.read_text(encoding='utf-8')
          antes_regiao = '.app-toast-region{position:fixed;'
          depois_regiao = '.app-toast-region{pointer-events:none;position:fixed;'
          antes_toast = '.app-toast{display:flex;'
          depois_toast = '.app-toast{pointer-events:auto;display:flex;'

          if antes_regiao not in css or antes_toast not in css:
              raise SystemExit('Seletores esperados de toast não foram encontrados.')

          css = css.replace(antes_regiao, depois_regiao, 1)
          css = css.replace(antes_toast, depois_toast, 1)
          css_path.write_text(css, encoding='utf-8')

          padrao = re.compile(r'(css/core/enhancements\.css\?v=)[^\"\']+')
          arquivos = [Path('index.html'), Path('sw.js'), *sorted(Path('html').glob('*.html'))]
          alterados = []
          for arquivo in arquivos:
              texto = arquivo.read_text(encoding='utf-8')
              novo = padrao.sub(r'\g<1>4.4.5.1', texto)
              if novo != texto:
                  arquivo.write_text(novo, encoding='utf-8')
                  alterados.append(str(arquivo))

          if not alterados:
              raise SystemExit('Nenhuma referência de enhancements.css foi atualizada.')

          print(f'Cache-busting atualizado em {len(alterados)} arquivos.')
          PY
      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/core/enhancements.css index.html sw.js html/*.html
          git commit -m "Impede overlay de toast de bloquear interações"
          git push
