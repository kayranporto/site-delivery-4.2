name: Fix mobile prepaint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mobile-prepaint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply responsive markers before first paint
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = {
              "index.html": "index",
              "html/restaurante.html": "restaurante",
              "html/checkout.html": "checkout",
              "html/pedido-sucesso.html": "pedido-sucesso",
              "html/meus-pedidos.html": "meus-pedidos",
              "html/acompanhamento.html": "acompanhamento",
              "html/favoritos.html": "favoritos",
              "html/perfil.html": "perfil",
              "html/enderecos.html": "enderecos",
              "html/dados.html": "dados",
              "html/suporte.html": "suporte",
              "html/privacidade.html": "privacidade",
          }

          def html_tag(match):
              tag = match.group(0)
              if 'data-client-mobile=' not in tag:
                  tag = tag[:-1] + ' data-client-mobile="true">'
              return tag

          def body_tag(match, page):
              tag = match.group(0)
              if 'class=' in tag:
                  tag = re.sub(
                      r'class=(["\'])(.*?)\1',
                      lambda m: f'class={m.group(1)}{m.group(2)} client-mobile-shell{m.group(1)}' if 'client-mobile-shell' not in m.group(2).split() else m.group(0),
                      tag,
                      count=1,
                  )
              else:
                  tag = tag[:-1] + ' class="client-mobile-shell">'
              if 'data-client-page=' not in tag:
                  tag = tag[:-1] + f' data-client-page="{page}">'
              return tag

          changed = []
          for filename, page in pages.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              updated = re.sub(r'<html\b[^>]*>', html_tag, text, count=1, flags=re.I)
              updated = re.sub(r'<body\b[^>]*>', lambda m: body_tag(m, page), updated, count=1, flags=re.I)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(filename)

          print("Updated:", ", ".join(changed) if changed else "none")
      - name: Verify responsive markers
        shell: python
        run: |
          from pathlib import Path
          pages = {
              "index.html": "index", "html/restaurante.html": "restaurante", "html/checkout.html": "checkout",
              "html/pedido-sucesso.html": "pedido-sucesso", "html/meus-pedidos.html": "meus-pedidos",
              "html/acompanhamento.html": "acompanhamento", "html/favoritos.html": "favoritos", "html/perfil.html": "perfil",
              "html/enderecos.html": "enderecos", "html/dados.html": "dados", "html/suporte.html": "suporte",
              "html/privacidade.html": "privacidade",
          }
          for filename, page in pages.items():
              text = Path(filename).read_text(encoding="utf-8")
              assert 'data-client-mobile="true"' in text, filename
              assert 'client-mobile-shell' in text, filename
              assert f'data-client-page="{page}"' in text, filename
      - name: Run project checks
        run: npm test
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html html/*.html
          git commit -m "fix: activate client mobile layout before first paint"
          git push origin HEAD:main
