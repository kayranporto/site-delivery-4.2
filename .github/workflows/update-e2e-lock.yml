name: Atualizar lock E2E

on:
  push:
    branches: [agent/playwright-e2e]
    paths:
      - package.json
      - .github/workflows/update-e2e-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Atualizar package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Publicar lock atualizado
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Atualiza lock para Playwright 1.62.1"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
