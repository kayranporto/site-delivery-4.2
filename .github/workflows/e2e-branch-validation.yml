name: Validar E2E na branch

on:
  push:
    branches: [agent/playwright-e2e]
    paths:
      - '.github/workflows/e2e-branch-validation.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar E2E
        run: npm run test:e2e
      - name: Salvar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-branch
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
